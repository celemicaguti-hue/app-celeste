<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ff85a1">
  <meta name="application-name" content="Rutina">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rutina">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <title>Rutina</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#f7eef7; }
    #celeste-frame { position:fixed; inset:0; width:100%; height:100%; border:0; background:#fff; }
    #privacy-veil {
      position:fixed; inset:0; z-index:999999; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg,#f7dce8 0%,#dceeff 52%,#e0f3ec 100%);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    #privacy-veil.hidden { display:none; }
    .privacy-card { width:min(88vw,360px); padding:30px 24px; text-align:center; border-radius:28px; background:rgba(255,255,255,.82); box-shadow:0 18px 55px rgba(90,65,110,.14); border:1px solid rgba(255,255,255,.95); }
    .privacy-icon { font-size:40px; margin-bottom:10px; }
    .privacy-title { font-size:23px; font-weight:800; color:#443a54; margin-bottom:6px; }
    .privacy-sub { font-size:13px; line-height:1.45; color:#8d8799; margin-bottom:20px; }
    .privacy-show { width:100%; border:0; border-radius:17px; padding:14px 18px; font-size:15px; font-weight:800; color:white; cursor:pointer; background:linear-gradient(135deg,#ff85a1,#c97fff); box-shadow:0 7px 20px rgba(255,133,161,.28); }
    #quick-hide { position:fixed; z-index:999998; right:12px; top:12px; border:1px solid rgba(255,255,255,.9); background:rgba(255,255,255,.86); backdrop-filter:blur(10px); color:#665d73; border-radius:14px; padding:8px 11px; font-size:12px; font-weight:800; cursor:pointer; box-shadow:0 4px 14px rgba(80,60,100,.10); display:none; }
  </style>
</head>
<body>
  <iframe id="celeste-frame" src="legacy.html" title="Rutina"></iframe>
  <button id="quick-hide" type="button" aria-label="Ocultar contenido">◉ Ocultar</button>
  <div id="privacy-veil">
    <div class="privacy-card">
      <div class="privacy-icon">🌷</div>
      <div class="privacy-title">Rutina</div>
      <div class="privacy-sub">Tu contenido personal está oculto. Un toque para continuar.</div>
      <button class="privacy-show" id="privacy-show" type="button">Abrir</button>
    </div>
  </div>
  <script src="enhancements.js"></script>
  <script src="intensity-safe.js?v=1"></script>
</body>
</html>
